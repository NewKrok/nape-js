name: Benchmark

# Manual trigger only. Results are uploaded as an artifact and compared
# against benchmarks/baseline.json (informational).
on:
  workflow_dispatch:

jobs:
  benchmark:
    name: Performance Budget
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      # --expose-gc lets the harness collect between trials instead of eating a
      # major GC mid-measurement; it cut worst-case run-to-run spread from ~80%
      # to under 7%.
      - name: Run benchmarks
        run: node --expose-gc benchmarks/run.mjs --json > benchmarks/current.json

      # Compare against the committed baseline. Informational only: the
      # committed numbers come from a developer machine, so a regression here
      # is a prompt to re-run locally, not a hard gate.
      - name: Compare against committed baseline
        run: node benchmarks/compare.mjs benchmarks/baseline.json benchmarks/current.json --threshold 10 --normalize
        continue-on-error: true

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.sha }}
          path: benchmarks/current.json
          retention-days: 90

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Inter, Helvetica Neue, Liberation Sans, DejaVu Sans, sans-serif">
  <!-- Social card for napejs.org. Generated to PNG by scripts/build-social-card.mjs.
       Figures are filled in from package.json / the test suite at build time, so
       they cannot drift the way the hand-typed ones did. -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#12181f"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c9d6e4"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="880" cy="250" rx="440" ry="330" fill="url(#glow)"/>
  <rect x="0" y="0" width="1200" height="5" fill="url(#accent)"/>

  <!-- Physics vignette: the engine's own subject matter, drawn as bodies at
       rest in a pile. Replaces the empty lower-right quadrant of the old card. -->
  <g opacity="0.5">
    <line x1="700" y1="470" x2="1120" y2="470" stroke="#30363d" stroke-width="2"/>
    <circle cx="800" cy="440" r="30" fill="none" stroke="#58a6ff" stroke-width="2.5"/>
    <circle cx="800" cy="440" r="4" fill="#58a6ff"/>
    <rect x="845" y="412" width="58" height="58" fill="none" stroke="#3fb950" stroke-width="2.5" rx="3"/>
    <rect x="915" y="424" width="46" height="46" fill="none" stroke="#58a6ff" stroke-width="2.5" rx="3" transform="rotate(12 938 447)"/>
    <circle cx="1010" cy="448" r="22" fill="none" stroke="#d29922" stroke-width="2.5"/>
    <path d="M859 412 l30 0 l-15 -24 z" fill="none" stroke="#58a6ff" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="758" cy="452" r="18" fill="none" stroke="#3fb950" stroke-width="2.5"/>
  </g>

  <!-- Logo -->
  <g transform="translate(96,104) scale(0.5)">
    <g transform="translate(0,287) scale(0.1,-0.1)" fill="url(#accent)" stroke="none">
      <path d="M1705 2430 c-145 -27 -292 -101 -399 -201 -40 -37 -72 -59 -87 -59 -39 0 -121 -45 -161 -86 -105 -111 -103 -282 5 -385 l34 -33 -26 -55 c-22 -47 -26 -70 -26 -146 0 -82 3 -97 33 -157 58 -118 179 -208 327 -245 45 -11 66 -21 70 -34 10 -29 61 -60 102 -61 25 -1 63 10 107 31 127 60 263 101 331 100 22 0 11 -6 -41 -23 -97 -31 -226 -101 -324 -176 -68 -52 -86 -61 -108 -55 -56 13 -204 71 -397 155 -206 90 -292 116 -348 105 -17 -3 -75 -27 -127 -53 -129 -64 -177 -65 -306 -5 -124 58 -166 55 -180 -13 -11 -58 67 -122 209 -171 86 -30 275 -42 372 -24 l59 11 51 -48 c337 -325 618 -462 951 -462 207 0 385 52 528 154 221 157 296 385 196 592 -32 66 -136 186 -181 209 l-28 15 32 54 c32 54 32 54 87 58 101 7 193 70 234 158 29 63 28 170 -1 226 -41 77 -114 131 -194 141 -37 5 -40 9 -54 56 -55 186 -239 357 -441 411 -73 20 -232 28 -299 16z m-268 -331 c15 -5 39 -21 53 -34 l26 -24 64 25 c145 59 316 4 379 -122 47 -94 27 -217 -47 -297 -33 -35 -103 -72 -155 -81 -37 -7 -37 -7 -23 -34 35 -69 27 -150 -21 -223 -56 -84 -182 -131 -305 -111 -251 38 -376 263 -243 436 l34 45 -19 45 c-32 71 -36 150 -11 221 23 64 76 129 126 151 36 16 104 18 142 3z"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="250" y="186" font-size="82" font-weight="800" fill="url(#title)" letter-spacing="-1.5">nape-js</text>
  <text x="253" y="232" font-size="27" fill="#8b949e">2D physics engine for TypeScript &amp; JavaScript</text>

  <!-- The one-line pitch: what it is, and why this package rather than the original. -->
  <text x="96" y="308" font-size="25" fill="#c9d6e4">Rigid bodies &#183; constraints &#183; fluids &#183; raycasting &#183; deterministic multiplayer</text>
  <text x="96" y="348" font-size="22" fill="#3fb950">The actively maintained TypeScript successor to Nape.</text>

  <!-- Numbers. Every figure here is generated, never typed by hand. -->
  <g>
    <text x="96" y="428" font-size="38" font-weight="700" fill="#e6edf3">SIZE</text>
    <text x="96" y="456" font-size="17" fill="#8b949e">gzip, full engine</text>

    <line x1="245" y1="404" x2="245" y2="458" stroke="#30363d" stroke-width="1.5"/>

    <text x="278" y="428" font-size="38" font-weight="700" fill="#e6edf3">TESTS</text>
    <text x="278" y="456" font-size="17" fill="#8b949e">tests passing</text>

    <line x1="430" y1="404" x2="430" y2="458" stroke="#30363d" stroke-width="1.5"/>

    <text x="463" y="428" font-size="38" font-weight="700" fill="#e6edf3">ZERO</text>
    <text x="463" y="456" font-size="17" fill="#8b949e">dependencies</text>
  </g>

  <!-- Install line -->
  <rect x="96" y="512" width="470" height="52" rx="10" fill="#1c2128" stroke="#30363d" stroke-width="1"/>
  <text x="118" y="545" font-family="DejaVu Sans Mono, Liberation Mono, Menlo, Courier New, monospace" font-size="19" fill="#3fb950">$</text>
  <text x="143" y="545" font-family="DejaVu Sans Mono, Liberation Mono, Menlo, Courier New, monospace" font-size="19" fill="#e6edf3">npm install @newkrok/nape-js</text>

  <text x="596" y="545" font-size="19" fill="#8b949e">napejs.org &#183; MIT</text>

  <rect x="0" y="625" width="1200" height="5" fill="url(#accent)"/>
</svg>
